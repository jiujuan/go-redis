# go-redis 默认配置文件
# 此文件仅作文档说明用途，实际配置通过命令行参数或环境变量生效
# 挂载到容器: -v /path/to/go-redis.conf:/etc/go-redis/go-redis.conf

# 服务监听地址（容器内应为 0.0.0.0）
host 0.0.0.0

# 监听端口
port 6379

# 访问密码（留空表示不验证）
# password yourpassword

# 分片数量（必须是 2 的幂次，影响并发性能）
# shards 256

# 最大连接数
# max-connections 10000

# ---------- AOF 持久化 ----------
# 开启 AOF：yes / no
# aof no

# AOF 文件路径（容器内建议写到 /data）
# aof-file /data/appendonly.aof

# AOF sync 策略：always | everysec | no
# aof-sync everysec

# ---------- RDB 快照 ----------
# 开启 RDB：yes / no
# rdb no

# RDB 文件路径
# rdb-file /data/dump.rdb
